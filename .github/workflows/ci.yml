name: CI

# WHEN to run: pushes to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeship_test
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeship_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeship_test
      JWT_SECRET_KEY: jwt-key-placeholder-required-variable

    steps:
      # 1. Clone the repo onto the runner.
      - uses: actions/checkout@v4

      # 2. Install Python 3.13 and put it on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install the project + dev tools (pytest, pylint) from pyproject.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # 4. Lint every tracked .py file. pyproject's ignore-paths already
      #    skips alembic/versions and .venv, so this respects the config.
      - name: Lint
        run: pylint $(git ls-files '*.py')

      # 5. Pure unit tests — no database required.
      - name: Unit tests
        run: pytest tests/unit

      # 6. Integration tests - use test database.
      - name: Integration tests
        run: pytest tests/integration
