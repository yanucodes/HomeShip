[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeship"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.136",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "tzdata>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pylint>=3.0"]

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "database.py",
    "dependencies.py",
    "security.py",
    "config.py",
    "models",
    "repositories",
    "routers",
    "schemas",
    "services",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
# Migrations under alembic/versions are autogenerated; don't lint generated code.
# The virtualenv holds third-party code; never lint it.
ignore-paths = ["alembic/versions/.*", "\\.venv/.*"]

[tool.pylint.typecheck]
# alembic.context populates its API (config, configure, run_migrations, ...)
# dynamically at runtime, so pylint can't see those members statically and
# emits false no-member errors. Treat the module as dynamic.
ignored-modules = ["alembic.context"]

[tool.pylint."messages control"]
# Disabled checks, each a false positive for this codebase's idioms:
#  - unsubscriptable-object: SQLAlchemy 2.0's typed `Mapped[...]` columns are
#    correct but pylint can't resolve `Mapped` as a subscriptable generic.
#  - too-few-public-methods: ORM models, Pydantic schemas and Settings are
#    declarative data containers by design; the heuristic doesn't apply.
disable = ["unsubscriptable-object", "too-few-public-methods"]

[tool.pylint.similarities]
# Each test module owns its own fixtures/data so the suites stay independent
# (deliberate duplication, not a DRY violation). Raise the duplicate-code
# threshold above a typical small fixture so it stops flagging those, while
# still catching genuinely large copy-paste blocks.
min-similarity-lines = 10

[tool.pylint.design]
# Thresholds raised to fit this codebase's deliberate patterns:
#  - max-args / max-positional-arguments: keyword-only factory builders
#    (Supply.set_alert_on_creation, Task.scheduled) and the ShipService DI
#    constructor (6 injected repositories) legitimately take more.
#  - max-returns: Supply.derive_alert is a flat decision tree of guard returns.
#  - max-public-methods: ShipService is a deliberate facade over tasks,
#    supplies and members.
max-args = 9
max-positional-arguments = 6
max-returns = 8
max-public-methods = 25

[project.urls]
"Source Code" = "https://github.com/yanucodes/HomeShip"

[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/alembic"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"

