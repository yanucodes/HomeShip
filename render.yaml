services:
  - type: web
    name: homeship-api
    runtime: image
    image:
      url:
        docker.io/yanucodes/homeship-api:latest
    plan: free
    autoDeploy: false
    # Free instances don't run preDeployCommand, so migrations run at startup.
    # Switch to a `preDeployCommand` if this service moves to a paid plan.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeship-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: homeship-db
    plan: free
